# Application Configuration
spring.application.name=leak-processor
server.port=${SERVER_PORT:8080}

# Database Configuration (MySQL)
# Automatically creates the database "leak_db" if it does not exist in MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/leak_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate configurations
# update will automatically sync the entities with MySQL tables
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Spring Mail configurations (Gmail SMTP setup)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your_email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your_app_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# VNPT CTIP API configurations
# Use http://localhost:8080 to test with the local simulated server
ctip.api.url=${CTIP_API_URL:http://localhost:8080}
ctip.api.key=${CTIP_API_KEY:mock-ctip-api-key}
ctip.api.enrichment-url=${CTIP_API_ENRICHMENT_URL:http://localhost:8080/api/v1/account-leak/credentials/enrichment}
ctip.api.statuses-url=${CTIP_API_STATUSES_URL:http://localhost:8080/api/v1/account-leak/statuses}
ctip.api.connect-timeout-ms=5000
ctip.api.read-timeout-ms=10000
ctip.api.domain-search=vnpt.vn
ctip.api.page-size=100

# Job 1 Search Window Configurations (0 = All, 1 = Past 24h, 7 = Past Week)
job1.scan.days-back=0

# VNPT SmartCA API configurations
smartca.api.url=${SMARTCA_API_URL:http://localhost:8080}
smartca.api.token-url=${SMARTCA_API_TOKEN_URL:http://localhost:8080/auth/token}
smartca.api.userinfo-url=${SMARTCA_API_USERINFO_URL:http://localhost:8080/identityapi/userinfo/info}
smartca.api.client-id=${SMARTCA_CLIENT_ID:mock-smartca-client-id}
smartca.api.client-secret=${SMARTCA_CLIENT_SECRET:mock-smartca-client-secret}
smartca.api.connect-timeout-ms=5000
smartca.api.read-timeout-ms=10000

# Scheduler Cron Configurations
# Job 1: Quét CTIP, Auth SmartCA & Lấy Info (Chạy lúc 00:00 hàng ngày)
job1.scan.cron=0 0 0 * * *
# Job 2: Gửi email cảnh báo & Đóng CTIP (Chạy lúc 00:00 mỗi 3 ngày)
job2.email.cron=0 0 0 */3 * *

# Telegram Bot Configurations (Group VNPT SmartCA Alerts)
telegram.bot.enabled=${TELEGRAM_BOT_ENABLED:true}
telegram.bot.token=${TELEGRAM_BOT_TOKEN:mock-telegram-bot-token}
telegram.bot.chat-id=${TELEGRAM_BOT_CHAT_ID:mock-telegram-chat-id}
telegram.bot.connect-timeout-ms=5000
